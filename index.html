<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Light refraction lab</title>
<link rel="icon" href="assets/icon.svg">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0d12; color: #d7dbe6;
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; touch-action: none; cursor: grab; }
  button, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: #1a1e28; border: 1px solid #2c3242; border-radius: 6px; }
  button:hover { background: #232938; }
  button[aria-pressed="true"] { background: #2b4a8f; border-color: #4c82ff; }
  :focus-visible { outline: 2px solid #7aa2ff; outline-offset: 1px; }

  #shapes { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 4px;
    padding: 4px; background: #12151c; border: 1px solid #2c3242; border-radius: 9px; }
  #shapes button { width: 38px; height: 34px; display: grid; place-items: center; }
  svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linejoin: round; }

  #toggle, #toggleLeft { position: fixed; top: 12px; right: 12px; width: 38px; height: 34px; display: grid; place-items: center; }
  #toggleLeft { right: auto; left: 12px; }
  #left { position: fixed; top: 56px; left: 12px; bottom: 58px; width: 280px; display: flex; flex-direction: column;
    padding: 4px 14px 14px; background: #12151cee; border: 1px solid #2c3242; border-radius: 9px; }
  #left[hidden] { display: none; }
  #left .seg { margin-bottom: 6px; }
  #status { min-height: 1.4em; color: #8b93a7; }
  #panel { position: fixed; top: 56px; right: 12px; bottom: 12px; width: 280px; overflow-y: auto; padding: 4px 14px 14px;
    background: #12151cee; border: 1px solid #2c3242; border-radius: 9px; }
  #panel[hidden] { display: none; }
  h2 { margin: 16px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: #8b93a7; }
  .row { display: block; margin-bottom: 9px; }
  .row > span { display: flex; justify-content: space-between; }
  .row output { color: #9fb8ff; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; margin: 3px 0 0; accent-color: #4c82ff; }
  select { width: 100%; margin-top: 3px; padding: 5px; background: #1a1e28; border: 1px solid #2c3242; border-radius: 6px; }
  .seg { display: flex; gap: 4px; margin-bottom: 10px; }
  .seg button { flex: 1; padding: 5px 0; }
  #editor { position: relative; flex: 1; min-height: 0; margin-bottom: 8px; background: #0e1118;
    border: 1px solid #2c3242; border-radius: 6px; overflow: hidden; }
  #editor.bad { border-color: #e5484d; }
  #editor:focus-within { border-color: #4c82ff; }
  #hl, #json { position: absolute; inset: 0; width: 100%; height: 100%; margin: 0; border: 0; padding: 8px;
    font: 11.5px/1.55 ui-monospace, Menlo, Consolas, monospace; white-space: pre; tab-size: 2; }
  #hl { overflow: hidden; color: #8b93a7; counter-reset: line; }
  #hl div::before { counter-increment: line; content: counter(line); display: inline-block; width: 28px;
    margin-right: 10px; text-align: right; color: #4a5268; }
  #json { padding-left: 46px; overflow: auto; resize: none; outline: none; background: none;
    color: transparent; caret-color: #d7dbe6; }
  #json::selection { background: #2b4a8f88; }
  .k { color: #9fb8ff; } .s { color: #a5d6a7; } .n { color: #f2b880; } .b { color: #d7a6ff; }
  .wide { width: 100%; padding: 6px 0; margin-bottom: 4px; }
  .check { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; }
  .check input { accent-color: #4c82ff; margin: 0; }
  #readout div { font-variant-numeric: tabular-nums; margin-bottom: 3px; }
  .formula { margin: 0 0 8px; color: #9fb8ff; }
  #hint { position: fixed; left: 14px; right: 310px; bottom: 12px; margin: 0; color: #6c7488; pointer-events: none; }
</style>
</head>
<body>
<canvas id="cv" aria-label="Optical bench. Drag the light source or the object."></canvas>
<nav id="shapes" aria-label="Add an object"></nav>
<button id="toggle" aria-label="Show or hide the properties panel" aria-expanded="true">
  <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M14 5v14h5a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2z" fill="currentColor"/></svg>
</button>
<button id="toggleLeft" aria-label="Show or hide the setup JSON panel" aria-expanded="true">
  <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 5v14H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z" fill="currentColor"/></svg>
</button>
<aside id="left" aria-label="Setup as JSON">
  <h2>Setup JSON</h2>
  <div id="editor">
    <pre id="hl" aria-hidden="true"></pre>
    <textarea id="json" wrap="off" aria-label="Setup as JSON. Edits apply when the text is valid." spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
  </div>
  <div class="seg"><button id="format">Format</button><button id="revert">Revert</button></div>
  <div class="seg"><button id="export">Copy JSON</button><button id="link">Copy link</button></div>
  <div id="status" role="status"></div>
</aside>
<aside id="panel" aria-label="Properties">
  <div id="controls"></div>
  <h2>Reference ray</h2>
  <p class="formula">Snell's law: n₁ sin θ₁ = n₂ sin θ₂</p>
  <div id="readout" aria-live="off"></div>
</aside>
<p id="hint">Click a shape to add it. Drag objects or the light source, drag the round handle to aim. Scroll rotates the selected object, Delete removes it. Ctrl or Cmd with C and V copies and pastes it.</p>
<script src="optics.js"></script>
<script src="app.js"></script>
</body>
</html>
